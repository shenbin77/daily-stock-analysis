name: 每日股票分析

on:
  # 定时触发 - 每天北京时间 18:00 (UTC 10:00)
  schedule:
    - cron: '0 10 * * 1-5'     # 周一到周五，UTC 10:00 = 北京时间 18:00
  
  # 手动触发
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - market-only
          - stocks-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

# 并发控制：同一时间只运行一个分析任务
concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 随机延迟（避免固定时间访问）
        run: sleep $((RANDOM % 60))
      
      - name: 检出代码
        uses: actions/checkout@v5
      
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import futu; print('✅ futu SDK import OK')"
      
      - name: 创建必要目录
        run: |
          mkdir -p data logs reports
      
      - name: 执行股票分析
        env:
          # AI 配置（AGNES）
          OPENAI_API_KEY: ${{ secrets.LLM_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LITELLM_MODEL: ${{ vars.LITELLM_MODEL || 'openai/agnes-2.5-flash' }}
          LLM_CHANNELS: ${{ vars.LLM_CHANNELS || 'openai' }}
          LLM_OPENAI_BASE_URL: ${{ vars.LLM_OPENAI_BASE_URL || 'https://apihub.agnes-ai.com/v1' }}
          LLM_OPENAI_MODELS: ${{ vars.LLM_OPENAI_MODELS || 'agnes-2.5-flash' }}
          
          # 飞书推送
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          
          # 自选股
          STOCK_LIST: ${{ vars.STOCK_LIST || '600519,AAPL,TSLA,00700,002594,300750' }}
          
          # 报告语言
          REPORT_LANGUAGE: ${{ vars.REPORT_LANGUAGE || 'zh' }}
          
          # 运行配置
          REPORT_TYPE: simple
          REPORT_SHOW_LLM_MODEL: true
          MARKET_REVIEW_ENABLED: true
          LOG_LEVEL: INFO
        run: |
          echo "=========================================="
          echo "🚀 A股自选股智能分析系统"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "📊 自选股: $STOCK_LIST"
          echo "📝 报告类型: $REPORT_TYPE"
          echo ""
          echo "【AI 配置】"
          echo "  OPENAI_API_KEY: $([ -n \"$OPENAI_API_KEY\" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo "  OPENAI_BASE_URL: $OPENAI_BASE_URL"
          echo "  LITELLM_MODEL: $LITELLM_MODEL"
          echo ""
          echo "【推送渠道】"
          echo "  飞书 Webhook: $([ -n \"$FEISHU_WEBHOOK_URL\" ] && echo '✅ 已配置' || echo '❌ 未配置')"
          echo ""
          echo "=========================================="
          echo "开始分析..."
          echo "=========================================="
          python main.py --stocks "$STOCK_LIST"
